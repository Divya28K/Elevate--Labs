<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>📝 My To-Do List</h1>

    <div id="todo-form">
      <input type="text" id="task-input" placeholder="What needs to be done?">
      <button id="add-btn">Add</button>
    </div>

    <section>
      <h2>Tasks</h2>
      <ul id="task-list"></ul>
    </section>

    <section>
      <div class="completed-header">
        <h2>Completed Tasks</h2>
        <button id="toggle-completed">Hide</button>
      </div>
      <ul id="completed-list" class="visible"></ul>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
